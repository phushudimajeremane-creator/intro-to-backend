[build]
  # Keep your core backend compiling as expected
  base = "backend"
  functions = "src"
  # FIXED: Tells Netlify to serve files inside the root directory or public folder statically
  publish = "." 

[functions]
  node_bundler = "esbuild"

# Rule 1: Send all explicit API traffic directly to your Express Backend Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/api/:splat"
  status = 200
  force = true

# Rule 2: If a visitor hits a path that doesn't match an API route or a static file,
# fallback cleanly to your main HTML file on the CDN layer.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
