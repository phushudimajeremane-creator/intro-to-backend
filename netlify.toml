[build]
  # Tell Netlify the workspace root folder is the base
  base = ""
  # Points Netlify to your frontend files at the root
  publish = "."
  # Tells Netlify exactly where to find and compile your backend functions
  functions = "backend/src"

[functions]
  node_bundler = "esbuild"

# 1. Forward all explicit API calls straight to your Express serverless app
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/api/:splat"
  status = 200
  force = true

# 2. Fallback rule: Forward the root path (/) and any non-API web routes to your index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
